<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Spotidown</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <header class="topbar">
    <div class="tb-left">
      <span class="app-logo">
        <span class="logo-dot"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></span>
        <span class="logo-text">Spotidown</span>
      </span>
      <button id="btn-back" class="tb-nav" title="Atrás" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button id="btn-fwd" class="tb-nav" title="Adelante" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>

    <div class="tb-center">
      <button id="btn-home" class="tb-home active" title="Inicio">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>
      <label class="tb-search">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        <input id="search" type="text" placeholder="¿Qué quieres reproducir?" spellcheck="false"/>
        <button id="search-clear" class="search-clear" title="Borrar" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </label>
    </div>

    <div class="win-btns">
      <button id="btn-min" title="Minimizar">&#8211;</button>
      <button id="btn-max" title="Maximizar">&#9633;</button>
      <button id="btn-close" class="close" title="Cerrar">&#10005;</button>
    </div>
  </header>

  <div class="app-layout">

    <aside class="panel sidebar">
      <div class="sb-header">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 5h-3v5.5a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1 2.5-2.5c.57 0 1.08.19 1.5.51V5h4v2zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/></svg>
        <span>Tu biblioteca</span>
      </div>
      <div class="sb-chips">
        <button class="chip" data-filter="all">Todo</button>
        <button class="chip" data-filter="artist">Artistas</button>
        <button class="chip" data-filter="album">Álbumes</button>
      </div>
      <ul id="lib-list" class="lib-list"></ul>
      <p id="lib-status" class="lib-status"></p>
    </aside>

    <main class="panel main">

      <section id="view-home" class="view">
        <div class="scroller" id="home-scroll">
          <div class="home-bg" id="home-bg"></div>
          <div class="home-content">
            <h1 id="home-greeting">Hola</h1>
            <div id="home-tiles" class="tiles"></div>
            <section class="shelf">
              <div class="shelf-head"><h2>Escuchado recientemente</h2></div>
              <div id="home-recent-albums" class="shelf-row"></div>
            </section>
            <section class="shelf">
              <div class="shelf-head"><h2>Tus artistas favoritos</h2></div>
              <div id="home-artists" class="shelf-row"></div>
            </section>
            <section class="shelf">
              <div class="shelf-head"><h2>Tus álbumes</h2></div>
              <div id="home-albums" class="shelf-row"></div>
            </section>
          </div>
        </div>
      </section>

      <section id="view-collection" class="view" hidden>
        <div class="col-sticky" id="col-sticky">
          <button class="big-play small" id="col-sticky-play"></button>
          <span class="col-sticky-title" id="col-sticky-title"></span>
        </div>
        <div class="scroller" id="col-scroll">
          <div class="col-hero" id="col-hero">
            <div class="col-cover" id="col-cover"></div>
            <div class="col-info">
              <span class="col-type" id="col-type"></span>
              <h1 class="col-title" id="col-title"></h1>
              <div class="col-meta" id="col-meta"></div>
            </div>
          </div>
          <div class="col-body">
            <div class="col-actions" id="col-actions">
              <button class="big-play" id="col-play" title="Reproducir"></button>
              <button class="col-shuffle" id="col-shuffle" title="Aleatorio">
                <svg viewBox="0 0 24 24" fill="currentColor" width="30" height="30"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
              </button>
            </div>
            <div class="track-head" id="track-head">
              <span class="th-num">#</span>
              <span>Título</span>
              <span class="th-album">Álbum</span>
              <span class="th-dur"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg></span>
            </div>
            <p class="empty-msg" id="col-empty"></p>
            <ul id="song-list" class="track-list"></ul>
          </div>
        </div>
      </section>

      <section id="view-lyrics" class="view" hidden>
        <div class="scroller" id="lyrics-scroll">
          <div class="lyrics-inner" id="lyrics-inner"></div>
        </div>
      </section>

    </main>

    <aside class="panel rightpanel" id="right-panel" hidden>
      <div class="rp-header">
        <span id="rp-title"></span>
        <button id="rp-close" class="rp-close" title="Cerrar">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div id="rp-np" class="rp-body">
        <div class="np-cover ph" id="np-cover"></div>
        <div class="np-row">
          <div class="np-text">
            <div class="np-title link-plain" id="np-title">Nada sonando</div>
            <div class="np-artist" id="np-artist"></div>
          </div>
          <button class="like-btn" id="np-like" title="Me gusta"></button>
        </div>
        <canvas id="spectrum" class="spectrum"></canvas>
        <div class="np-card" id="np-next-card" hidden>
          <div class="np-card-head">
            <span>Siguiente en la cola</span>
            <button id="np-open-queue">Abrir cola</button>
          </div>
          <ul id="np-next" class="mini-list"></ul>
        </div>
      </div>

      <div id="rp-queue" class="rp-body" hidden>
        <h3 class="q-section">Sonando ahora</h3>
        <ul id="queue-now" class="mini-list"></ul>
        <h3 class="q-section" id="queue-next-label">A continuación</h3>
        <ul id="queue-list" class="mini-list"></ul>
      </div>
    </aside>

  </div>

  <footer class="player-bar">
    <div class="bar-left">
      <div class="bar-thumb ph" id="bar-cover" title="Mostrar vista Reproduciendo"></div>
      <div class="bar-info">
        <div class="bar-title" id="bar-song-title">Sin canción seleccionada</div>
        <div class="bar-artist" id="bar-song-artist"></div>
      </div>
      <button class="like-btn" id="bar-like" title="Me gusta" hidden></button>
    </div>

    <div class="bar-center">
      <div class="bar-controls">
        <button id="btn-shuffle" class="bar-btn" title="Aleatorio">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="btn-prev" class="bar-btn" title="Anterior">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6L20 6v12z"/></svg>
        </button>
        <button id="btn-play" class="bar-btn bar-play-btn" title="Reproducir">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"></svg>
        </button>
        <button id="btn-next" class="bar-btn" title="Siguiente">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-repeat" class="bar-btn" title="Activar repetición">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>
      <div class="bar-seek">
        <span id="t-cur">0:00</span>
        <div class="slider-track" id="seek-track">
          <div class="slider-fill" id="seek-fill"></div>
          <div class="slider-thumb" id="seek-thumb"></div>
        </div>
        <span id="t-tot">0:00</span>
      </div>
    </div>

    <div class="bar-right">
      <button id="btn-np" class="bar-btn" title="Vista Reproduciendo">
        <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" width="18" height="18"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5zm2 0v14h8V5H5zm10 0v14h4V5h-4z"/></svg>
      </button>
      <button id="btn-lyrics" class="bar-btn" title="Letra">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <button id="btn-queue" class="bar-btn" title="Cola">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18A3 3 0 0 0 16 14a3 3 0 1 0 3 3V8h3V6h-5z"/></svg>
      </button>
      <button id="btn-mute" class="bar-btn" title="Silenciar"></button>
      <div class="slider-track" id="vol-track">
        <div class="slider-fill" id="vol-fill"></div>
        <div class="slider-thumb" id="vol-thumb"></div>
      </div>
    </div>
  </footer>

  <audio id="audio"></audio>
  <script src="renderer.js"></script>
</body>
</html>
